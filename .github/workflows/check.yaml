name: Check

# Vets, tests and builds every push to main and every pull request, on Linux
# and Windows, so that a broken build is found before a release is attempted.

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

# A newer push makes the checks of an older one pointless.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-latest, windows-latest ]

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-build

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./cmd/pdx-portrait-creator
